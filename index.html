<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio & Réservation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Mon Portfolio</h1>
        <nav>
            <a href="#portfolio">Réalisations</a>
            <a href="#reservation">Réservation</a>
        </nav>
    </header>

    <!-- Section Portfolio Video -->
    <section id="portfolio">
        <h2>Mes Réalisations</h2>
        <div class="filter-buttons">
            <button onclick="filterCategory('all')">Tous</button>
            <button onclick="filterCategory('sport')">Salles de Sport</button>
            <button onclick="filterCategory('supermarche')">Supermarchés</button>
            <button onclick="filterCategory('restaurant')">Restaurants</button>
        </div>

        <div class="video-grid">
            <div class="video-card sport">
                <video controls src="votre-video-sport1.mp4"></video>
                <p>Projet Salle de Sport</p>
            </div>
            <div class="video-card supermarche">
                <video controls src="votre-video-supermarche1.mp4"></video>
                <p>Projet Supermarché</p>
            </div>
            <div class="video-card restaurant">
                <video controls src="votre-video-resto1.mp4"></video>
                <p>Projet Restaurant</p>
            </div>
        </div>
    </section>

    <!-- Section Réservation -->
    <section id="reservation">
        <h2>Réserver une prestation</h2>
        <form id="bookingForm">
            <label for="name">Nom complet :</label>
            <input type="text" id="name" required>

            <label for="email">Email :</label>
            <input type="email" id="email" required>

            <label for="date">Date de réservation (minimum 5 jours à l'avance) :</label>
            <input type="date" id="date" required>

            <p class="payment-info"><strong>Mode de paiement :</strong> Espèces le jour du tournage.</p>

            <button type="submit">Confirmer la réservation</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>

</html>
